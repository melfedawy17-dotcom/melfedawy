
name: daily-auto-draft
on:
  schedule:
    - cron: '0 5 * * *'   # 07:00 بتوقيت القاهرة
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language: both | ar | en'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - ar
          - en
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: pick topic
        id: t
        run: |
          IDX=$(( $(date -u +%s) / 86400 % 30 ))
          DATA=$(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/assets/data/topics.json)
          TOPIC=$(echo "$DATA" | python3 -c "import json,sys;print(json.load(sys.stdin)['topics'][$IDX]['t'])")
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "slug=ai-$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "idx=$IDX" >> "$GITHUB_OUTPUT"
      - name: generate draft(s) + cover + notify
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY || secrets.GEMINIKEY }}
          CB_APIKEY: ${{ secrets.CB_APIKEY || secrets.CALLMBOTAPIKEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TOPIC: ${{ steps.t.outputs.topic }}
          SLUG: ${{ steps.t.outputs.slug }}
          IDX: ${{ steps.t.outputs.idx }}
          AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH }}
          LANGSEL: ${{ github.event.inputs.lang || 'both' }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse,base64,datetime
          key=os.environ.get('GEMINI_KEY','') or ''
          if not key:
              print('لا يوجد مفتاح GEMINI_KEY — تخطٍ'); raise SystemExit(0)
          topic=os.environ['TOPIC']; slug0=os.environ['SLUG']; repo=os.environ['REPO']
          sel=os.environ.get('LANGSEL','both') or 'both'
          langs=['ar','en'] if sel=='both' else [sel]
          def gem(model,parts):
              req=urllib.request.Request('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+key,
                data=json.dumps({'contents':[{'parts':parts}]}).encode(),headers={'Content-Type':'application/json'})
              return json.load(urllib.request.urlopen(req,timeout=120))
          def pick_model():
              try:
                  rq=urllib.request.Request('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+key)
                  ms=json.load(urllib.request.urlopen(rq,timeout=60)).get('models',[])
                  names=[m['name'].replace('models/','') for m in ms]
                  names=[n for n in names if ('flash' in n or 'pro' in n) and not any(x in n for x in ['image','audio','video','tts','embedding','think'])]
                  for p in ['gemini-flash-latest','gemini-pro-latest']:
                      if p in names: return p
                  for n in names:
                      if 'flash' in n: return n
                  return names[0] if names else 'gemini-flash-latest'
              except Exception as e:
                  print('model list fail',e); return 'gemini-flash-latest'
          PROMPTS={'ar':'أنت مساعد كتابة لمستشار أعمال مصري اسمه محمد الفداوي. اكتب مقالًا تعليميًا بالعربية (٤٥٠–٦٠٠ كلمة) بعنوان: '+topic+' . قواعد صارمة: لا تذكر عملاء بأسمائهم، لا أرقام إيرادات أو نسب نجاح مخترعة، لا شهادات أو جوائز، لا وعود بنتائج مضمونة؛ أمثلة عامة فقط. أسلوب تنفيذي مباشر، فقرات قصيرة، عناوين فرعية، وخاتمة فيها دعوة لمناقشة المشروع عبر الموقع. أعد JSON فقط: {"title":..,"excerpt":..,"body":..} حيث body بصيغة Markdown.',
                   'en':'You are the writing assistant of Egyptian business consultant Mohamed Elfedawy. Write an educational English article (450-600 words) titled: '+topic+'. Strict rules: never name clients, never invent revenue figures or success rates, no certifications or awards, no guaranteed-outcome promises; general examples only. Style: executive, direct, short paragraphs, subheadings, closing invitation to discuss the project via the website. Return JSON only: {"title":..,"excerpt":..,"body":..} with body in Markdown.'}
          def gen(ln,model):
              r=gem(model,[{'text':PROMPTS[ln]}])
              txt=r['candidates'][0]['content']['parts'][0]['text']
              a=txt.find('{'); b=txt.rfind('}')
              j=None
              if a>-1 and b>a:
                  try: j=json.loads(txt[a:b+1])
                  except Exception: j=None
              if j and j.get('title'): return j
              return {'title':topic,'excerpt':topic,'body':txt}
          def api(path,method='GET',body=None):
              url='https://api.github.com/repos/'+repo+'/contents/'+path
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              if body is not None: headers['Content-Type']='application/json'
              rq=urllib.request.Request(url,data=json.dumps(body).encode() if body is not None else None,method=method,headers=headers)
              try:
                  return json.load(urllib.request.urlopen(rq,timeout=60))
              except urllib.error.HTTPError as e:
                  if e.code==404 and method=='GET': return None
                  raise
          def put(path,text,msg):
              cur=api(path)
              body={'message':msg,'content':base64.b64encode(text.encode()).decode(),'branch':'main'}
              if cur and 'sha' in cur: body['sha']=cur['sha']
              api(path,'PUT',body)
          try: idx=int(os.environ.get('IDX','0'))
          except Exception: idx=0
          cover='assets/img/covers/c%02d.webp'%((idx%16)+1)
          try:
              urllib.request.urlopen(urllib.request.Request('https://raw.githubusercontent.com/'+repo+'/main/'+cover,method='HEAD'),timeout=30)
          except Exception:
              cover='assets/img/case-feasibility.jpg'
          status='published' if os.environ.get('AUTO_PUBLISH','').lower()=='true' else 'draft'
          model=pick_model(); made=[]
          for ln in langs:
              try: art=gen(ln,model)
              except Exception as e:
                  print('gen fail',ln,e); continue
              slug=slug0 if ln=='ar' else slug0+'-en'
              put('content/posts/'+slug+'.md',art.get('body',''),'ai article: '+slug)
              idxj=api('content/posts.json')
              posts=json.loads(base64.b64decode(idxj['content']).decode()) if idxj else []
              posts=[x for x in posts if x.get('slug')!=slug]
              posts.append({'slug':slug,'title':art.get('title',topic),'excerpt':art.get('excerpt',''),'date':datetime.date.today().isoformat(),'lang':ln,'status':status,'cover':cover})
              put('content/posts.json',json.dumps(posts,ensure_ascii=False,indent=1),'ai index: '+slug)
              made.append((ln,art.get('title',topic)))
          if made:
              msg='🤖 مسودة/مسودات جديدة بانتظار موافقتك:\n'+'\n'.join('- ['+ln+'] '+ti for ln,ti in made)+'\nلوحة التحكم → المقالات → موافقة/نشر'
              cb=(os.environ.get('CB_APIKEY','') or '').replace('\n','').replace(' ','')
              if cb:
                  try:
                      urllib.request.urlopen('https://api.callmebot.com/whatsapp.php?phone=%2B201146905560&apikey='+cb+'&text='+urllib.parse.quote(msg),timeout=30); print('WA sent')
                  except Exception as e: print('WA fail',e)
              try:
                  req=urllib.request.Request('https://formsubmit.co/ajax/m.elfedawy17@gmail.com',
                    data=json.dumps({'message':msg,'_subject':'مسودة مقال جديدة — بانتظار موافقتك'}).encode(),
                    headers={'Content-Type':'application/json','Accept':'application/json'})
                  urllib.request.urlopen(req,timeout=30); print('email sent')
              except Exception as e: print('email fail',e)
          else:
              raise SystemExit('لم يُنتج أي مسودة')
          PY
