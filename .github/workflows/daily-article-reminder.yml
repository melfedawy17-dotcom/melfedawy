
name: daily-article-reminder
on:
  schedule:
    - cron: '0 6 * * *'   # 08:00 بتوقيت القاهرة
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: pick today topic
        id: topic
        run: |
          IDX=$(( $(date -u +%s) / 86400 % 30 ))
          TOPIC=$(curl -s https://raw.githubusercontent.com/melfedawy17-dotcom/melfedawy/main/assets/data/topics.json | python3 -c "import json,sys;print(json.load(sys.stdin)['topics'][$IDX]['t'])")
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
      - name: whatsapp reminder via CallMeBot
        if: ${{ (secrets.CB_APIKEY != '') || (secrets.CALLMBOTAPIKEY != '') }}
        run: |
          TEXT=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote('📝 موضوع مقال اليوم: '+os.environ['T']+' — لوحة التحكم → المقالات → توليد مسودة اليوم'))")
          curl -s "https://api.callmebot.com/whatsapp.php?phone=%2B201146905560&apikey=${{ secrets.CB_APIKEY || secrets.CALLMBOTAPIKEY }}&text=$TEXT"
        env:
          T: ${{ steps.topic.outputs.topic }}
